name: publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: each reads the version the one before it took.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # The test workflow has already succeeded for this commit on main. Release
    # only when that commit is a pull request merged into main; a direct push
    # stays unreleased. .github/scripts/release_decision.py picks the version:
    # VERSION when it is ahead of what is published, one patch higher when the
    # shipped files changed since the last release's tag, and otherwise no
    # release at all, so a change to tests, the demo, or the docs ships nothing.
    # The version is written into this workspace only and is never committed.
    #
    # There is no API token. PyPI Trusted Publishing trades this job's GitHub
    # OIDC token for a short-lived upload token. PyPI must hold a publisher for
    # this repository, publish.yml and the environment pypi.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wsfed-caep/
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Every tag: the last release's tag is what the decision compares with.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a release
        id: decide
        if: steps.gate.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .github/scripts/release_decision.py decide pypi wsfed-caep "$SHA" src pyproject.toml

      - name: Build the sdist and the wheel
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -eu
          python3 .github/scripts/release_decision.py stamp pypi "$VERSION"
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            python:3.11-slim \
            sh -c 'pip install --no-cache-dir --quiet build twine && python -m build --outdir dist && twine check --strict dist/*'
          ls -l dist

      - name: Upload to PyPI
        if: steps.decide.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # Publishing and this step are one release: the tag it creates is the
      # baseline the next decision compares with.
      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
