name: Nightly

on:
  schedule:
    # 06:35 UTC. The authentication client libraries share one two-hour window.
    - cron: '35 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit suite
        run: docker build --target test .
      - name: Live iya-sts
        run: python3 scripts/live_iya_sts.py
