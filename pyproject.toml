[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wsfed-caep"
version = "0.1.0"
description = "Server-side WS-Federation relying party that accepts SAML 2.0 assertions, and a CAEP and RISC receiver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iya CyberSecurity Solutions, LLC" }]
keywords = ["ws-federation", "wsfed", "saml2", "caep", "risc", "shared-signals"]
dependencies = [
  "cryptography>=42",
  "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsfed-caep = "wsfed_caep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]

[project.urls]
Homepage = "https://github.com/rcbj/wsfed-caep-python"
Repository = "https://github.com/rcbj/wsfed-caep-python"
Issues = "https://github.com/rcbj/wsfed-caep-python/issues"
